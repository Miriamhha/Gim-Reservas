<div class="min-h-screen p-6 bg-gray-50 flex flex-col items-center">

  <!-- Mostrar usuario logueado -->
  <div *ngIf="user" class="mb-4 text-lg font-semibold text-gray-700">
    Bienvenido, {{ user.displayName }}
  </div>

  <!-- Botones login/logout -->
  <div class="space-x-4 mb-6">
    <button *ngIf="!user" (click)="loginGoogle()"
            class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
      Iniciar sesión con Google
    </button>

    <button *ngIf="user" (click)="logout()"
            class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
      Cerrar sesión
    </button>
  </div>

  <!-- Clases disponibles -->
  <h2 class="text-2xl font-bold text-[var(--color-morado)] mb-4">Clases disponibles</h2>
  <ul class="w-full max-w-md space-y-4 mb-6">
    <li *ngFor="let r of reservas" class="bg-white rounded-lg shadow p-4 flex justify-between items-center">
      <div>
        <p class="font-semibold">{{ r.tipo }}</p>
        <p class="text-sm text-gray-500">{{ r.fecha }} - {{ r.hora }}</p>
      </div>
      <button (click)="reservarHorario(r)"
              class="bg-blue-600 text-white px-3 py-1 rounded-lg hover:bg-blue-700 transition">
        Reservar
      </button>
    </li>
  </ul>

  <!-- Mis reservas -->
  <div *ngIf="user">
    <h2 class="text-2xl font-bold text-[var(--color-morado)] mb-4">Mis reservas</h2>
    <ul class="w-full max-w-md space-y-4">
      <li *ngFor="let r of reservasUsuario" class="bg-yellow-100 rounded-lg shadow p-4 flex justify-between items-center">
        <div>
          <p class="font-semibold">{{ r.tipo }}</p>
          <p class="text-sm text-gray-500">{{ r.fecha }} - {{ r.hora }}</p>
        </div>
      </li>
    </ul>
  </div>
</div>
