<!-- src/app/login.html -->
<div class="flex items-center gap-4">
  <ng-container *ngIf="user$ | async as user; else loggedOut">
    <div class="text-sm">
      <div class="font-semibold">{{ user.email }}</div>
    </div>
    <button (click)="logout()"
            class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg shadow">
      Cerrar sesión
    </button>
  </ng-container>

  <ng-template #loggedOut>
    <button (click)="login()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg shadow">
      Iniciar con Google
    </button>
  </ng-template>
</div>
